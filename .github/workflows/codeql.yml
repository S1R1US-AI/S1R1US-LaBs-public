name: CodeQL

# CodeQL on every push to any branch or tag, every pull request, and weekly on main.
# Works only while this repository is public (free code scanning); on a private
# user-owned repo the upload is refused. Advanced setup (this file) is used instead
# of default setup because default setup scans pushes only to the default and
# protected branches. Check name for the ruleset: "Analyze (javascript-typescript)".

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 9 * * 1'

permissions: {}

concurrency:
  # Pull requests: one run per PR, newer pushes cancel older. Pushes: one run per ref + commit, never cancelled.
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read          # check out the code
      security-events: write  # upload results to code scanning
      actions: read           # read workflow run info for the upload
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
