name: CodeQL

# CodeQL on every push to any branch or tag, every pull request, and weekly on main.
# Works only while this repository is public (free code scanning); on a private
# user-owned repo the upload is refused. Advanced setup (this file) is used instead
# of default setup because default setup scans pushes only to the default and
# protected branches. Check name for the ruleset: "Analyze (javascript-typescript)".
#
# Dependabot cannot upload SARIF. Its push token is read-only, and its pull_request
# token is still refused by the code scanning API ("Code scanning is not enabled")
# even with security-events: write. Actions-token runs, including pushes to the
# default branch, upload successfully, so the repository feature stays on.
# scripts/codeql-upload-mode.mjs selects upload=never only for that actor off the
# default branch. CodeQL Action v4.39.3 then skips the upload and still fails the
# step when the CLI fails. upload=false is not used: that value means failure-only.
# The SARIF is stored as a workflow artifact. Every other actor keeps upload=always,
# so an upload error is never ignored.

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 9 * * 1'

permissions: {}

concurrency:
  # Pull requests: one run per PR, newer pushes cancel older. Pushes: one run per ref + commit, never cancelled.
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read          # check out the code
      security-events: write  # upload results to code scanning
      actions: read           # read workflow run info for the upload
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Choose CodeQL upload mode
        id: codeql-upload
        env:
          CODEQL_ACTOR: ${{ github.actor }}
          CODEQL_REF: ${{ github.ref }}
          CODEQL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/codeql-upload-mode.mjs
      - id: codeql-analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ steps.codeql-upload.outputs.mode }}
          output: codeql-sarif
      - name: Upload CodeQL SARIF artifact
        if: ${{ success() && steps.codeql-upload.outputs.mode == 'never' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.codeql-analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 14
